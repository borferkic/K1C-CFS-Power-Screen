name: powerscreen zbolt build

on:
  push:
    branches: [ "develop", "main" ]
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      POWERSCREEN_ROTATE: true

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: install build dependencies and MIPS toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake
        TOOLCHAIN_ARCHIVE="$RUNNER_TEMP/mips-gcc720-glibc229.tar.gz"
        TOOLCHAIN_ROOT="$RUNNER_TEMP/mips-toolchain"
        mkdir -p "$TOOLCHAIN_ROOT"
        curl --fail --location --retry 3 \
          https://github.com/ballaswag/k1-discovery/releases/download/1.0.0/mips-gcc720-glibc229.tar.gz \
          --output "$TOOLCHAIN_ARCHIVE"
        tar -xzf "$TOOLCHAIN_ARCHIVE" -C "$TOOLCHAIN_ROOT"
        TOOLCHAIN_BIN="$(find "$TOOLCHAIN_ROOT" -type d -name bin -print -quit)"
        test -n "$TOOLCHAIN_BIN"
        echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
        TOOLCHAIN_PREFIX="$(find -L "$TOOLCHAIN_BIN" -maxdepth 1 -type f -name '*gcc' -print -quit | sed 's/gcc$//')"
        test -n "$TOOLCHAIN_PREFIX"
        echo "CROSS_COMPILE=$TOOLCHAIN_PREFIX" >> "$GITHUB_ENV"
        echo "CC=$TOOLCHAIN_PREFIX" >> "$GITHUB_ENV"
        echo "CXX=$TOOLCHAIN_PREFIX" >> "$GITHUB_ENV"

    - name: set powerscreen version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          echo "POWERSCREEN_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        else
          echo "POWERSCREEN_VERSION=nightly-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
        fi

    - name: patch lv_drivers
      run: git apply ../patches/0001-lv_driver_fb_ioctls.patch
      working-directory: ./lv_drivers

    - name: patch fmt in spdlog
      run: git apply ../patches/0002-spdlog_fmt_initializer_list.patch
      working-directory: ./spdlog

    - name: patch dpi text scale in lvgl
      run: git apply ../patches/0003-lvgl-dpi-text-scale.patch
      working-directory: ./lvgl

    - name: make wpaclient
      run: make wpaclient

    - name: make libhv
      run: make libhv.a

    - name: make libspdlog
      run: make libspdlog.a

    - name: make powerscreen
      run: make -j

    - name: make kd_graphic_mode
      run: make kd_graphic_mode

    - name: package zbolt
      run: |
        chmod +x ./release.sh
        ./release.sh powerscreen-zbolt

    - uses: actions/upload-artifact@v4
      with:
        name: powerscreen-zbolt
        path: ./powerscreen-zbolt.tar.gz
