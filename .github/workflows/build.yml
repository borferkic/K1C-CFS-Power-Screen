name: guppy zbolt build

on:
  push:
    branches: [ "develop", "main" ]
    tags:
      - "*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ballaswag/guppydev:latest
      options: --user 1001

    env:
      CROSS_COMPILE: mipsel-buildroot-linux-musl-
      CC: mipsel-buildroot-linux-musl-
      CXX: mipsel-buildroot-linux-musl-
      GUPPY_THEME: zbolt
      GUPPY_ROTATE: true

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: set guppyscreen version
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          echo "GUPPYSCREEN_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
        else
          echo "GUPPYSCREEN_VERSION=nightly-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
        fi

    - name: patch lv_drivers
      run: git apply ../patches/0001-lv_driver_fb_ioctls.patch
      working-directory: ./lv_drivers

    - name: patch fmt in spdlog
      run: git apply ../patches/0002-spdlog_fmt_initializer_list.patch
      working-directory: ./spdlog

    - name: patch dpi text scale in lvgl
      run: git apply ../patches/0003-lvgl-dpi-text-scale.patch
      working-directory: ./lvgl

    - name: make wpaclient
      run: make wpaclient

    - name: make libhv
      run: make libhv.a

    - name: make libspdlog
      run: make libspdlog.a

    - name: make guppyscreen
      run: make -j

    - name: make kd_graphic_mode
      run: make kd_graphic_mode

    - name: package zbolt
      run: |
        chmod +x ./release.sh
        ./release.sh guppyscreen-zbolt

    - uses: actions/upload-artifact@v4
      with:
        name: guppyscreen-zbolt
        path: ./guppyscreen-zbolt.tar.gz
