###### STANDARD INPUT_SHAPER CALIBRATIONS ######
################################################
# Written by Frix_x#0161 #
# https://github.com/Frix-x/klippain-shaketune

[gcode_macro PS_EXCITATE_AXIS_AT_FREQ]
description: Maintain a specified excitation frequency for a period of time to diagnose and locate a source of vibration
gcode:
  {% set frequency = params.FREQUENCY|default(25)|int %}
  {% set time = params.TIME|default(10)|int %}
  {% set axis = params.AXIS|default("x")|string|lower %}

  {% if axis not in ["x", "y", "a", "b"] %}
      { action_raise_error("AXIS selection invalid. Should be either x, y, a or b!") }
  {% endif %}

  {% if axis == "a" %}
      {% set axis = "1,-1" %}
  {% elif axis == "b" %}
      {% set axis = "1,1" %}
  {% endif %}

  TEST_RESONANCES OUTPUT=raw_data AXIS={axis} FREQ_START={frequency-1} FREQ_END={frequency+1} HZ_PER_SEC={1/(time/3)}
  M400



[gcode_macro PS_UNLOAD_FILAMENT]
description: Cut and unload the filament
gcode:
  # Home if needed
  IF_NEED_HOME

  # Lower the bed to a safe height only if needed
  {% set current_z = printer.toolhead.position.z|float %}
  {% if current_z < 30 %}
    G91
    G0 Z{30 - current_z} F600
    G90
    M400
  {% endif %}

  # Cutter preload position
  G90
  G0 Y180 F12000
  G0 X42 F12000

  # Relieve nozzle pressure if it is hot
  {% if printer.extruder.temperature >= 170 %}
    M83
    G1 E-10 F300
    M400
  {% endif %}

  # Set acceleration for the cutting move
  SET_VELOCITY_LIMIT ACCEL=5000 ACCEL_TO_DECEL=30000

  # Cut the filament at the X position and speed of the cutter in box.cfg, so it does not hit as hard.
  # The Y of the cut stays at 225.2: the box.cfg value (222.8) does not cut with this macro.
  {% set box_cfg = printer.configfile.settings['box'] %}
  {% set cut_x = box_cfg.cut_pos_x|default(42.0)|float %}
  {% set cut_y = 225.2 %}
  {% set cut_speed = box_cfg.cut_velocity|default(8000)|float %}
  {% for _ in range(1) %}
    G0 X{cut_x} Y{cut_y} F{cut_speed}
    G0 X{cut_x} Y180 F{cut_speed}
  {% endfor %}
  M400

  # Fully unload the filament
  M83
  G1 E-100 F600
  M400

[gcode_macro PS_LOAD_FILAMENT]
description: Load, purge and wipe the new filament
gcode:
  # The printer must be homed
  {% if "xyz" not in printer.toolhead.homed_axes %}
    { action_raise_error("The printer must be homed before loading filament.") }
  {% endif %}

  # Purge temperature
  {% set temp = params.EXTRUDER_TEMP|default(220)|int %}

  # Lower the bed to a safe height if the toolhead is below Z30
  {% set current_z = printer.toolhead.position.z|float %}
  {% if current_z < 30 %}
    G91
    G0 Z{30 - current_z} F600
    G90
    M400
  {% endif %}

  # Move to the safe purge tray position
  G90
  G0 X148.5 F5000
  M400
  G0 Y225 F5000
  M400

  # Heat the nozzle
  M109 S220

  # Load and purge the filament
  M83
  G1 E100 F600
  M400

  # Retract slightly to break the string
  G1 E-5 F600
  M400

  # Lower the temperature before wiping
  M109 S180

  # Cool the filament tip
  SET_PIN PIN=fan0 VALUE=128
  G4 P4000
  SET_PIN PIN=fan0 VALUE=0
  G4 P3000
  M400

  # Wipe the nozzle
  PS_CLEAN_BRUSH

  # After a pause, heat back to 10 C under the print temperature that the pause saved and wait there.
  # PS_RESUME finishes the heating and purges before the print continues.
  # A saved value of 0 means there is nothing to restore.
  {% set print_temp = printer['gcode_macro PRINTER_PARAM'].hotend_temp|int %}
  {% if print_temp > 0 %}
    M109 S{print_temp - 10}
  {% endif %}

# Resume after a manual filament change. The name has no M600 in it on purpose: the firmware
# parser reads M600_RESUME as the M600 command and pauses the print again.
# It restores what the M600 macro of the CFS Power Script changed (if installed), heats to the
# print temperature, purges 10 mm and then runs the factory RESUME.
[gcode_macro PS_RESUME]
description: Purge 10 mm and resume the print after a filament change
gcode:
  {% if 'gcode_macro m600' in printer.configfile.settings %}
    {% set m600 = printer['gcode_macro M600'] %}
    {% if m600.fan0_speed > 0 %}
      {% set fan_min = printer['gcode_macro PRINTER_PARAM'].fan0_min %}
      M106 P0 S{(m600.fan0_speed * 255 - fan_min) * 255 / (255 - fan_min)|float}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=fan0_speed VALUE=0
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=m600_state VALUE=0
    SET_IDLE_TIMEOUT TIMEOUT=1800
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if printer.pause_resume.is_paused %}
    {% set print_temp = printer['gcode_macro PRINTER_PARAM'].hotend_temp|int %}
    {% if print_temp > 0 %}
      M109 S{print_temp}
    {% endif %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
      RESTORE_E_CURRENT
      M83
      G1 E10 F180
      M400
    {% endif %}
  {% endif %}
  RESUME

[gcode_macro PS_CANCEL]
description: Cancel the print from the manual filament change menu
gcode:
  {% if 'gcode_macro m600' in printer.configfile.settings %}
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=fan0_speed VALUE=0
    SET_GCODE_VARIABLE MACRO=M600 VARIABLE=m600_state VALUE=0
    SET_IDLE_TIMEOUT TIMEOUT=1800
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_end"
  CANCEL_PRINT

# Manual filament change menu. PowerScreen draws its own layout when the prompt
# title is exactly "MANUAL FILAMENT CHANGE". Used by the MANUAL M600 button and
# by the M600 macro of the CFS Power Script (M600 Support module).
[gcode_macro _PS_MANUAL_CHANGE_PROMPT]
description: Show the PowerScreen manual filament change menu
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin MANUAL FILAMENT CHANGE"
  RESPOND TYPE=command MSG="action:prompt_footer_button UNLOAD|PS_UNLOAD_FILAMENT|warning"
  RESPOND TYPE=command MSG="action:prompt_footer_button LOAD|PS_LOAD_FILAMENT|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button RESUME|PS_RESUME|success"
  RESPOND TYPE=command MSG="action:prompt_footer_button STOP|PS_CANCEL|error"
  RESPOND TYPE=command MSG="action:prompt_footer_button CLOSE|RESPOND TYPE=command MSG='action:prompt_end'|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro PS_CLEAN_BRUSH]
description: Wipe the nozzle on the brush
gcode:
  # Check that the toolhead is at the wipe position
  {% set x = printer.toolhead.position.x|float %}
  {% set y = printer.toolhead.position.y|float %}

  {% if (x - 148.5)|abs > 0.1 or (y - 225)|abs > 0.1 %}
    { action_raise_error("PS_CLEAN_BRUSH: The toolhead must be at X148.5 Y225.") }
  {% endif %}

  # Make two passes over the brush
  {% for _ in range(2) %}
    G0 X150.5 F5000
    G0 X168.5 F5000
  {% endfor %}
  M400

  # Leave the purge tray
  G90
  G0 X148.5 F6000
  M400
  G0 Y200 F6000
  M400

#### K1 load and unload ####
[gcode_macro _PS_LOAD_MATERIAL]
gcode:
  {% set extruder_temp = params.EXTRUDER_TEMP|default(220)|int %}

  LOAD_MATERIAL_CLOSE_FAN2

  PS_LOAD_FILAMENT EXTRUDER_TEMP={extruder_temp}

  LOAD_MATERIAL_RESTORE_FAN2

[gcode_macro _PS_QUIT_MATERIAL]
gcode:
  SAVE_GCODE_STATE NAME=myMoveState

  PS_UNLOAD_FILAMENT

  RESTORE_GCODE_STATE NAME=myMoveState
